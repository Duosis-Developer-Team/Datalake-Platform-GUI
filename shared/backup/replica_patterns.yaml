# Global DR / replica VM name patterns.
# Seed for Administration → Platform → Backup Mapping.
#
# Classification order:
#   1) silinecek exclude
#   2) veeam_dr patterns  → Veeam DR / replication (default: _DR, _DRC, embedded -dr-)
#   3) altra_replica patterns → external Altra / Cloud Connect style replicas
#      (default: _replica, _replika, contains replica/replika)
#   4) custom patterns → non-standard operator additions (e.g. ALT-TRA-DER)
#   5) remainder → billable virtualization
#
# Zerto VMs are identified from raw_zerto_vm_metrics (not name patterns).
# Operators may later override via Platform Backup Mapping UI / webui DB;
# this YAML remains the default seed when no override is loaded.
#
# Match methods: suffix | contains | prefix | exact

version: 2

silinecek:
  - id: silinecek_contains
    match: contains
    value: silinecek
    case_insensitive: true

# Veeam DR defaults (_dr → Veeam replication).
veeam_dr_patterns:
  - id: suffix_dr
    match: suffix
    value: _DR
    case_insensitive: true
  - id: suffix_drc
    match: suffix
    value: _DRC
    case_insensitive: true
  - id: embedded_dr_hyphen
    match: contains
    value: "-dr-"
    case_insensitive: true
  - id: embedded_dr_underscore
    match: contains
    value: "_dr_"
    case_insensitive: true

# Altra / external replica defaults (not in our estate; Cloud Connect style).
altra_replica_patterns:
  - id: suffix_replica
    match: suffix
    value: _replica
    case_insensitive: true
  - id: suffix_replika
    match: suffix
    value: _replika
    case_insensitive: true
  - id: contains_replica
    match: contains
    value: replica
    case_insensitive: true
  - id: contains_replika
    match: contains
    value: replika
    case_insensitive: true

# Non-standard operator patterns (empty seed; add via Backup Mapping later).
custom_patterns: []

# Documentary: vendor counter reconciliation targets.
vendor_reconciliation:
  veeam:
    description: >
      Compare veeam_dr name-pool size to SUM(objects_count) for Replica
      session/job types (session_type primary, jobs.type fallback).
    metric: objects_count
    bucket: veeam_dr
  zerto:
    description: >
      Zerto VMs come from raw_zerto_vm_metrics / VPG matrix — not name patterns.
      Reconciliation uses SUM(vmscount) across VPGs.
    metric: vmscount
    bucket: zerto
  altra:
    description: >
      Altra / external replicas are name-classified only; CRM service mapping
      is deferred. No vendor counter yet.
    metric: name_count
    bucket: altra_replica
