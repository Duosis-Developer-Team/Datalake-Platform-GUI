# Veeam session_type / jobs.type → Replication vs Backup (Platform Backup Mapping).
# Exact type strings listed under each bucket win; otherwise builtin contains
# heuristics (replica / backup) apply for unlisted values.
#
# Operators review these MultiSelects on Administration → Platform → Backup Mapping
# → Veeam session types. Save/DB persist is not wired yet — edit this YAML seed.

version: 1

veeam_replication_session_types:
  - ReplicaJob
  - VSphereReplica
  - Replica

veeam_backup_session_types:
  - BackupJob
  - Backup
  - BackupCopyJob
