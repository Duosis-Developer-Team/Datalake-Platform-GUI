apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulutistan-redis
  labels:
    app: bulutistan-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bulutistan-redis
  template:
    metadata:
      labels:
        app: bulutistan-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --maxmemory
            - 256mb
            # volatile-lru, not allkeys-lru: reclaim only keys that declared a
            # TTL. allkeys-lru dropped live frontend cache keys under memory
            # pressure, which the UI shows as a value vanishing between two
            # renders. Every writer sets an expiry now (frontend via
            # cache_service.MAX_ENTRY_AGE_SECONDS, the APIs via SETEX).
            - --maxmemory-policy
            - volatile-lru
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
