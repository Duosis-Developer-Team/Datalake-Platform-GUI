apiVersion: v1
kind: ConfigMap
metadata:
  name: bulutistan-datacenter-api-config
data:
  DB_HOST: "10.134.16.6"
  DB_PORT: "5000"
  DB_NAME: "bulutlake"
  DB_USER: "infra_svc"
  REDIS_HOST: "bulutistan-redis"
  REDIS_PORT: "6379"
  # This service's own database. db 0 is the frontend's
  # (k8s/frontend/configmap.yaml REDIS_URL), and /admin/cache/refresh here
  # flushes the whole db — sharing it wiped the frontend's cache.
  # Set explicitly even though app/config.py now defaults to 3, so the
  # ownership is visible where an operator would look for it.
  REDIS_DB: "3"
